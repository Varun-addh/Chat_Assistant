[pytest]
asyncio_mode = auto
# pytest-asyncio >=0.23 warns that the default loop scope will change.
# Pin it explicitly to keep behavior stable across versions.
asyncio_default_fixture_loop_scope = function

markers =
    fast: marks tests as fast (unit tests, no LLM calls, < 1s)
    slow: marks tests as slow (integration tests, LLM calls, > 1s)
